name: CI - Lint & Build

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    env:
      # Só precisa existir pra passar na checagem em src/lib/api/backend.ts durante o build
      # (module-level throw) — o valor real vem do ambiente da Vercel, não daqui.
      API_BASE_URL: https://ci-placeholder.invalid

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
